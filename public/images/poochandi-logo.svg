<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <!-- Character avatar icon -->
  <g transform="translate(10, 8)">
    <circle cx="32" cy="32" r="30" fill="#1e103c" stroke="#a855f7" stroke-width="2.5" />
    <!-- Character Ears / Horns -->
    <path d="M14 18 Q 8 6, 22 14" fill="#a855f7" />
    <path d="M50 18 Q 56 6, 42 14" fill="#a855f7" />
    <!-- Friendly Glowing Eyes -->
    <ellipse cx="23" cy="28" rx="5" ry="7" fill="#14b8a6" filter="url(#glow)" />
    <ellipse cx="41" cy="28" rx="5" ry="7" fill="#14b8a6" filter="url(#glow)" />
    <circle cx="24" cy="27" r="2" fill="#ffffff" />
    <circle cx="42" cy="27" r="2" fill="#ffffff" />
    <!-- Mischievous playful grin -->
    <path d="M22 42 Q 32 50, 42 42" stroke="#f97316" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Firefly sparkle -->
    <circle cx="54" cy="14" r="3" fill="#facc15" filter="url(#glow)" />
  </g>
  <!-- Text -->
  <text x="85" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="url(#logoGrad)" letter-spacing="1.5">POOCHANDI</text>
  <text x="86" y="62" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#94a3b8" letter-spacing="2">BY BUZZ CREATIONS</text>
</svg>
