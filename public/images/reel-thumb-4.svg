<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e103c" />
      <stop offset="100%" stop-color="#0a051d" />
    </linearGradient>
    <radialGradient id="thumbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.2" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" rx="20" fill="url(#cardGrad)" stroke="#3b1d70" stroke-width="2"/>
  <circle cx="200" cy="210" r="120" fill="url(#thumbGlow)" opacity="0.6"/>
  <!-- Instagram Badge -->
  <g transform="translate(30, 30)">
    <rect width="40" height="40" rx="10" fill="#e1306c" />
    <circle cx="20" cy="20" r="10" stroke="#fff" stroke-width="3" fill="none"/>
    <circle cx="28" cy="12" r="2.5" fill="#fff"/>
  </g>
  <!-- Mini Character face -->
  <circle cx="200" cy="210" r="60" fill="#2d1558" stroke="#a855f7" stroke-width="2"/>
  <ellipse cx="180" cy="200" rx="10" ry="14" fill="#14b8a6"/>
  <ellipse cx="220" cy="200" rx="10" ry="14" fill="#14b8a6"/>
  <circle cx="182" cy="198" r="4" fill="#fff"/>
  <circle cx="222" cy="198" r="4" fill="#fff"/>
  <path d="M185 230 Q 200 245, 215 230" stroke="#f97316" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Play Button -->
  <circle cx="200" cy="350" r="32" fill="#f97316" filter="drop-shadow(0 4px 10px rgba(249, 115, 22, 0.5))"/>
  <polygon points="193,338 213,350 193,362" fill="#ffffff" />
  <text x="200" y="420" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#e2e8f0" text-anchor="middle">@poochandi_ig Reel</text>
  <text x="200" y="445" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#94a3b8" text-anchor="middle">Tap to Watch</text>
</svg>
