<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f0728" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d70" />
      <stop offset="100%" stop-color="#190d3d" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Mystical Portal Ring -->
  <circle cx="300" cy="300" r="240" fill="url(#portalGlow)" />
  <circle cx="300" cy="300" r="210" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 12" opacity="0.6" />

  <!-- Fireflies in the night -->
  <circle cx="140" cy="180" r="4" fill="#fbbf24" filter="url(#softGlow)" />
  <circle cx="480" cy="220" r="5" fill="#2dd4bf" filter="url(#softGlow)" />
  <circle cx="160" cy="420" r="3" fill="#fb923c" filter="url(#softGlow)" />
  <circle cx="450" cy="380" r="4" fill="#fbbf24" filter="url(#softGlow)" />
  <circle cx="280" cy="110" r="5" fill="#a78bfa" filter="url(#softGlow)" />

  <!-- Character Silhouette -->
  <!-- Cute cape/shadow body -->
  <path d="M190 480 Q 200 240, 300 230 Q 400 240, 410 480 Q 300 520, 190 480 Z" fill="url(#bodyGrad)" stroke="#a855f7" stroke-width="3" />
  
  <!-- Character Head -->
  <ellipse cx="300" cy="220" rx="90" ry="85" fill="#231349" stroke="#c084fc" stroke-width="3.5" />
  
  <!-- Playful Horns / Tufts -->
  <path d="M245 155 Q 220 90, 260 140 Z" fill="#7c3aed" />
  <path d="M355 155 Q 380 90, 340 140 Z" fill="#7c3aed" />

  <!-- Magical Floating Wand / Star -->
  <g transform="translate(380, 260)">
    <circle cx="30" cy="30" r="14" fill="#fb923c" filter="url(#softGlow)" />
    <path d="M30 10 L30 50 M10 30 L50 30" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Big Glowing Friendly Eyes -->
  <ellipse cx="265" cy="210" rx="18" ry="24" fill="#14b8a6" filter="url(#softGlow)" />
  <ellipse cx="335" cy="210" rx="18" ry="24" fill="#14b8a6" filter="url(#softGlow)" />
  <ellipse cx="268" cy="206" rx="7" ry="10" fill="#ffffff" />
  <ellipse cx="338" cy="206" rx="7" ry="10" fill="#ffffff" />

  <!-- Cute Mischievous Smile -->
  <path d="M260 255 Q 300 285, 340 255" stroke="#f97316" stroke-width="5" stroke-linecap="round" fill="none" />
  
  <!-- Traditional Rudraksha / Pendant -->
  <circle cx="300" cy="325" r="12" fill="#ea580c" stroke="#fef08a" stroke-width="2" />
  <circle cx="300" cy="325" r="6" fill="#facc15" />
</svg>
